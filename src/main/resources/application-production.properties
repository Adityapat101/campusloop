# Hosting supplies PORT. The original local development configuration is unchanged.
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Require hosted databases instead of silently connecting to localhost.
spring.datasource.url=jdbc:postgresql://${PGHOST_UNPOOLED:${POSTGRES_HOST}}/${POSTGRES_DATABASE}?sslmode=require
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=campusloop

# Hosted data and schema already exist. Avoid catalog writes and schema updates
# on each new container; fail startup if the SQL schema no longer matches.
campusloop.seed.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# Do not expose database details or internal exceptions on the public deployment.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
