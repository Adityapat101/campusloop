spring.application.name=student-marketplace

# PostgreSQL owns structured, transactional records.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/marketplace}
spring.datasource.username=${POSTGRES_USER:marketplace}
spring.datasource.password=${POSTGRES_PASSWORD:marketplace}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# MongoDB owns flexible marketplace listing documents.
spring.mongodb.uri=${MONGODB_URI:mongodb://marketplace:marketplace@localhost:27017/marketplace?authSource=admin}
spring.mongodb.representation.uuid=standard

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
server.error.include-message=always
